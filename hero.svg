<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Rijul Dahiya">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .name {
        font-family: 'Caveat', 'Brush Script MT', 'Segoe Script', cursive;
        font-weight: 700;
        font-size: 130px;
        fill: #ffffff;
      }
      .sub {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 2px;
      }
    </style>

    <!-- Dark slate gradient backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Three wave paths, each animated horizontally -->
    <path id="wave1" d="M0,180 C150,140 300,220 450,180 C600,140 750,220 900,180 C1050,140 1200,220 1350,180 L1350,280 L0,280 Z"/>
    <path id="wave2" d="M0,200 C180,160 360,240 540,200 C720,160 900,240 1080,200 C1260,160 1440,240 1620,200 L1620,280 L0,280 Z"/>
    <path id="wave3" d="M0,220 C200,180 400,260 600,220 C800,180 1000,260 1200,220 C1400,180 1600,260 1800,220 L1800,280 L0,280 Z"/>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Waves (layered, semi-transparent, drifting at different speeds) -->
  <g opacity="0.35">
    <use href="#wave1" fill="#475569">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -150,0; 0,0" dur="9s" repeatCount="indefinite"/>
    </use>
  </g>
  <g opacity="0.5">
    <use href="#wave2" fill="#334155">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 180,0; 0,0" dur="11s" repeatCount="indefinite"/>
    </use>
  </g>
  <g opacity="0.75">
    <use href="#wave3" fill="#1e293b">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -200,0; 0,0" dur="13s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Name on top -->
  <text x="50%" y="140" text-anchor="middle" class="name">Rijul Dahiya</text>
  <text x="50%" y="180" text-anchor="middle" class="sub">ENGINEER  •  RESEARCHER  •  BUILDER</text>
</svg>
